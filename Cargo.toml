[package]
name = "mlua-typegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Extract Lua type stubs from mlua UserData impls using rustc's type inference"
license = "MIT"
repository = "https://github.com/themixednuts/mlua-typegen"

[package.metadata.mlua-typegen]
supported-mlua = ">=0.9.0, <0.13.0"

[[bin]]
name = "cargo-mlua-typegen"
path = "src/main.rs"

[[bin]]
name = "mlua-typegen-driver"
path = "src/driver.rs"

[lib]
name = "mlua_typegen"
path = "src/lib.rs"

[dependencies]
cargo_metadata = "0.23.1"
fs2 = "0.4.3"
heck = "0.5.0"
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
sha2 = "0.11.0"
