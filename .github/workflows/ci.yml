name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-06-30
          components: rustc-dev,llvm-tools-preview,rustfmt,clippy
      - name: Check installer syntax
        run: sh -n scripts/install.sh
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Error
            exit 1
          }
      - run: cargo +nightly-2026-06-30 fmt --all -- --check
      - run: cargo +nightly-2026-06-30 clippy --all-targets -- -D warnings
      - run: cargo +nightly-2026-06-30 test --all-targets

  mlua-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-06-30
          components: rustc-dev,llvm-tools-preview
      - run: cargo +nightly-2026-06-30 test --test mlua_compatibility -- --ignored --test-threads=1

  dialect-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-06-30
          components: rustc-dev,llvm-tools-preview
      - name: Install LuaLS 3.18.2
        run: |
          curl --fail --location --output lua-ls.tar.gz \
            https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-linux-x64.tar.gz
          echo "ca71415dd19f19e30aaa35a4915aefca9fdb5fec31b98331cc3d77f778d539c5  lua-ls.tar.gz" | sha256sum --check
          mkdir lua-ls
          tar --extract --gzip --file lua-ls.tar.gz --directory lua-ls
      - name: Install EmmyLua 0.25.1
        run: cargo +stable install emmylua_check --version 0.25.1 --locked
      - name: Validate production CLI output
        env:
          MLUA_TYPEGEN_LUALS: ${{ github.workspace }}/lua-ls/bin/lua-language-server
          MLUA_TYPEGEN_EMMYLUA_CHECK: /home/runner/.cargo/bin/emmylua_check
        run: cargo +nightly-2026-06-30 test --test cli_smoke -- --nocapture
